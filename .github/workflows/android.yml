name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.UNPAUSED_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Without a release key, APKs are signed with Android's debug key. Reusing the same debug key
      # across runs lets each new APK install over the previous one. Not restored for pull requests.
      - name: Reuse the CI debug signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: unpaused-debug-keystore-v1

      - name: Restore release keystore (only if the secret is set)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "UNPAUSED_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests (core logic + Robolectric)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      - name: Build APKs
        env:
          UNPAUSED_KEYSTORE_PASSWORD: ${{ secrets.UNPAUSED_KEYSTORE_PASSWORD }}
          UNPAUSED_KEY_ALIAS: ${{ secrets.UNPAUSED_KEY_ALIAS }}
          UNPAUSED_KEY_PASSWORD: ${{ secrets.UNPAUSED_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :app:assembleRelease :app:assembleDebug

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: unpaused-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/**/build/reports/**
            android/**/build/test-results/**
          if-no-files-found: ignore

      - name: Publish the APK as the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/unpaused.apk"
          signed="debug key (set the UNPAUSED_KEYSTORE_* secrets for a stable release key)"
          if [ -n "$KEYSTORE_B64" ]; then signed="release key"; fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/unpaused.apk" \
            --target "$GITHUB_SHA" \
            --title "Unpaused — latest build (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA} by run #${GITHUB_RUN_NUMBER}. Signed with the ${signed}. Install on Android: open this page on the phone, download unpaused.apk, allow 'Install unknown apps' for your browser."

  device-tests:
    name: Device tests (Android 15 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Playback, audio-focus and UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./scripts/run-instrumented.sh
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-results
          path: |
            screens/**
            android/app/build/reports/androidTests/**
          if-no-files-found: ignore
